<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NAGI DICE</title>
  <!-- Google Fonts: Fredoka & Outfit for chunky playful UI typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Outfit:wght@500;700;800;900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- BACKGROUND DECORATIVE NAGI IMAGES -->
  <img src="assets/nagi_blue.png" class="bg-nagi bg-nagi-1" alt="">
  <img src="assets/nagi_con_aura.png" class="bg-nagi bg-nagi-2" alt="">
  <img src="assets/nagi_con_enteazul.png" class="bg-nagi bg-nagi-3" alt="">
  <img src="assets/nagi_pensantivo.png" class="bg-nagi bg-nagi-4" alt="">
  <img src="assets/avatardealex.png" class="bg-alex-center" alt="">

  <div class="app-wrapper">

    <!-- LEFT VERTICAL TEXT -->
    <div class="vertical-side-text left-text" aria-hidden="true">
      <span>N</span>
      <span>A</span>
      <span>G</span>
      <span>I</span>
    </div>

    <!-- CENTER MAIN CONTAINER: NAGI DICE -->
    <main class="main-card">
      <header class="card-header">
        <button type="button" class="header-action-btn" id="paletteToggleBtn" title="Paleta de Colores"
          aria-label="Colores">
          <svg viewBox="0 0 24 24" fill="none" class="action-svg" stroke="white" stroke-width="2.2"
            stroke-linecap="round" stroke-linejoin="round">
            <path
              d="M12 2a10 10 0 0 0-10 10c0 5.5 4.5 10 10 10 .8 0 1.5-.7 1.5-1.5 0-.4-.2-.8-.4-1.1-.3-.3-.4-.7-.4-1.1 0-.8.7-1.5 1.5-1.5H16c3.3 0 6-2.7 6-6 0-5.5-4.5-9.8-10-9.8z">
            </path>
            <circle cx="12" cy="6.5" r="1.2" fill="white" stroke="none"></circle>
            <circle cx="7.5" cy="10.5" r="1.2" fill="white" stroke="none"></circle>
            <circle cx="16.5" cy="10.5" r="1.2" fill="white" stroke="none"></circle>
            <circle cx="8.5" cy="15" r="1.2" fill="white" stroke="none"></circle>
          </svg>
        </button>
        <div class="header-center-group">
          <div class="header-logo-icon nagi-mascot">
            <img src="assets/nagi_pensando.png" alt="Nagi Pensando" class="nagi-avatar-img">
          </div>
          <h1 class="main-title">NAGI DICE</h1>
        </div>
        <div class="header-actions-right">
          <button type="button" class="header-action-btn" id="historyToggleBtn" title="Historial"
            aria-label="Historial">
            <svg viewBox="0 0 24 24" fill="none" class="action-svg" stroke="white" stroke-width="2.2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 8v4l3 3"></path>
              <path d="M3.05 11a9 9 0 1 1 .5 4m-.5 5v-5h5"></path>
            </svg>
          </button>
          <button type="button" class="header-action-btn sound-toggle-btn" id="soundToggle"
            title="Activar/Desactivar Sonido" aria-label="Sonido">
            <svg viewBox="0 0 24 24" fill="none" class="sound-svg" stroke="white" stroke-width="2.2"
              stroke-linecap="round" stroke-linejoin="round">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="white"></polygon>
              <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
              <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
            </svg>
          </button>
        </div>
      </header>

      <!-- DROPDOWN CONTROLS -->
      <div class="controls-row">
        <div class="custom-select-wrapper" id="customDiceSelectWrapper">
          <select id="diceCountSelect" class="sr-only-select" tabindex="-1">
            <option value="1" selected>1 DICE</option>
            <option value="2">2 DICE</option>
            <option value="3">3 DICE</option>
            <option value="4">4 DICE</option>
            <option value="5">5 DICE</option>
            <option value="6">6 DICE</option>
          </select>
          <button type="button" class="custom-select-trigger" id="diceSelectTrigger" aria-haspopup="listbox"
            aria-expanded="false">
            <span class="select-label" id="diceSelectLabel">1 DICE</span>
            <svg class="select-arrow" viewBox="0 0 24 24" fill="none" stroke="#007aff" stroke-width="3"
              stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </button>
          <ul class="custom-select-options" id="diceSelectOptions" role="listbox">
            <li class="custom-select-option active" data-value="1" role="option">1 DICE</li>
            <li class="custom-select-option" data-value="2" role="option">2 DICE</li>
            <li class="custom-select-option" data-value="3" role="option">3 DICE</li>
            <li class="custom-select-option" data-value="4" role="option">4 DICE</li>
            <li class="custom-select-option" data-value="5" role="option">5 DICE</li>
            <li class="custom-select-option" data-value="6" role="option">6 DICE</li>
          </ul>
        </div>
      </div>

      <!-- DICE DISPLAY STAGE -->
      <div class="dice-stage" id="diceStage">
        <!-- Rendered dice will go here -->
      </div>

      <!-- ROLL ACTION BUTTON -->
      <div class="action-row">
        <button type="button" id="rollBtn" class="roll-btn">
          <span>VUELVE A TIRAR!</span>
        </button>
      </div>

      <!-- POSSIBLE COLORS TEXT -->
      <div class="possible-colors-container">
        <p id="possibleColorsText">Los colores posibles son: <span class="c-red">Rojo</span>, <span
            class="c-blue">Azul</span>, <span class="c-green">Verde</span>, <span class="c-purple">Morado</span>, <span
            class="c-yellow">Amarillo</span>, <span class="c-black">Negro</span> y <span class="c-white">Blanco</span>.
        </p>
      </div>

      <!-- BOTTOM CHECKBOXES -->
      <div class="color-checkboxes-row" id="checkboxesRow">
        <label class="chunky-checkbox red-cb">
          <input type="checkbox" data-color="red" checked>
          <span class="checkmark"></span>
          <span class="cb-label">ROJO</span>
        </label>
        <label class="chunky-checkbox blue-cb">
          <input type="checkbox" data-color="blue" checked>
          <span class="checkmark"></span>
          <span class="cb-label">AZUL</span>
        </label>
        <label class="chunky-checkbox green-cb">
          <input type="checkbox" data-color="green" checked>
          <span class="checkmark"></span>
          <span class="cb-label">VERDE</span>
        </label>
        <label class="chunky-checkbox purple-cb">
          <input type="checkbox" data-color="purple" checked>
          <span class="checkmark"></span>
          <span class="cb-label">MORADO</span>
        </label>
        <label class="chunky-checkbox yellow-cb">
          <input type="checkbox" data-color="yellow" checked>
          <span class="checkmark"></span>
          <span class="cb-label">AMARILLO</span>
        </label>
        <label class="chunky-checkbox black-cb">
          <input type="checkbox" data-color="black" checked>
          <span class="checkmark"></span>
          <span class="cb-label">NEGRO</span>
        </label>
        <label class="chunky-checkbox white-cb">
          <input type="checkbox" data-color="white" checked>
          <span class="checkmark"></span>
          <span class="cb-label">BLANCO</span>
        </label>
      </div>
    </main>

    <!-- RIGHT VERTICAL TEXT -->
    <div class="vertical-side-text right-text" aria-hidden="true">
      <span>N</span>
      <span>A</span>
      <span>G</span>
      <span>I</span>
    </div>

    <!-- LEFT SIDEBAR: COLORES DRAWER -->
    <aside class="sidebar left-sidebar" id="colorsSidebar">
      <div class="sidebar-header">
        <h2>COLORES</h2>
        <button type="button" class="sidebar-close-btn" id="closeColorsBtn" title="Cerrar"
          aria-label="Cerrar">✕</button>
      </div>
      <div class="color-picker-list">
        <button type="button" class="color-btn active" data-color="red" style="background-color: var(--color-red);"
          title="Rojo"></button>
        <button type="button" class="color-btn active" data-color="blue" style="background-color: var(--color-blue);"
          title="Azul"></button>
        <button type="button" class="color-btn active" data-color="green" style="background-color: var(--color-green);"
          title="Verde"></button>
        <button type="button" class="color-btn active" data-color="purple"
          style="background-color: var(--color-purple);" title="Morado"></button>
        <button type="button" class="color-btn active" data-color="yellow"
          style="background-color: var(--color-yellow);" title="Amarillo"></button>
        <button type="button" class="color-btn active" data-color="black" style="background-color: var(--color-black);"
          title="Negro"></button>
        <button type="button" class="color-btn active" data-color="white" style="background-color: var(--color-white);"
          title="Blanco"></button>
      </div>
    </aside>

    <!-- RIGHT SIDEBAR: YOUR ROLL -->
    <aside class="sidebar right-sidebar" id="rightSidebar">
      <div class="sidebar-header">
        <h2>HISTORIAL</h2>
        <button type="button" class="sidebar-close-btn" id="closeHistoryBtn" title="Cerrar"
          aria-label="Cerrar">✕</button>
      </div>
      <div class="history-display-box" id="historyBox">
        <div class="history-empty" id="historyEmpty">No hay tiradas!</div>
        <div class="history-list" id="historyList"></div>
      </div>
      <div class="history-actions">
        <button type="button" id="undoBtn" class="history-btn undo-btn">DESHACER</button>
        <button type="button" id="clearBtn" class="history-btn clear-btn">LIMPIAR</button>
      </div>
    </aside>

    <!-- BACKDROP FOR RESPONSIVE MODAL DRAWERS -->
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

  </div>

  <!-- MOBILE WARNING SCREEN -->
  <div class="mobile-warning-screen" id="mobileWarning">
    <div class="mobile-warning-card">
      <div class="mobile-warning-icon">
        <svg viewBox="0 0 64 64" fill="none" class="warning-svg">
          <rect x="16" y="8" width="32" height="48" rx="7" stroke="white" stroke-width="3.5"
            fill="rgba(255, 255, 255, 0.15)" />
          <line x1="27" y1="14" x2="37" y2="14" stroke="white" stroke-width="3" stroke-linecap="round" />
          <circle cx="32" cy="50" r="2" fill="white" />
          <circle cx="32" cy="32" r="11" fill="#ff3b30" stroke="white" stroke-width="2.5" />
          <line x1="24.5" y1="24.5" x2="39.5" y2="39.5" stroke="white" stroke-width="2.5" stroke-linecap="round" />
        </svg>
      </div>
      <h2>¡Lo sentimos!</h2>
      <p>No está disponible en este ancho de pantalla.</p>
    </div>
  </div>


  <script src="script.js"></script>
</body>

</html>
